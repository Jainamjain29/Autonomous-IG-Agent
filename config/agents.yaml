# Agent configuration: default settings and agent-specific configurations
# Note: API keys are NEVER stored here; they are loaded from .env only.

defaults:
  provider: gemini
  model: gemini-2.5-flash
  temperature: 0.7
  timeout_s: 30
  backup:
    provider: gemini
    model: gemini-2.5-flash-lite
    temperature: 0.7
    timeout_s: 30

agents:
  content:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.8
    timeout_s: 45
    backup:
      provider: gemini
      model: gemini-2.5-flash-lite
      temperature: 0.8
      timeout_s: 45

  video_gen:
    provider: openai_compat
    base_url: https://api.anthropic.com/v1/
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0.4
    timeout_s: 180
    max_tokens: 16000
    backup:
      provider: gemini
      model: gemini-2.5-flash
      temperature: 0.4
      timeout_s: 180
      max_tokens: 16000

  sync_merge:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.2
    timeout_s: 30
    backup:
      provider: gemini
      model: gemini-2.5-flash-lite
      temperature: 0.2
      timeout_s: 30

  qc:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.2
    timeout_s: 30
    backup:
      provider: gemini
      model: gemini-2.5-flash-lite
      temperature: 0.2
      timeout_s: 30

  posting:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.2
    timeout_s: 30
    backup:
      provider: gemini
      model: gemini-2.5-flash-lite
      temperature: 0.2
      timeout_s: 30
